name: goouts
description: GoOuts - Discover & Earn

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^8.1.0
  intl: ^0.19.0
  firebase_core: ^4.11.0
  firebase_crashlytics: ^5.2.4
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  cloud_functions: ^6.3.3
  firebase_storage: ^13.0.0
  firebase_messaging: ^16.0.0
  smooth_page_indicator: ^2.0.1
  confetti: ^0.8.0
  cached_network_image: ^3.3.1
  camera: ^0.12.0+1
  image: ^4.1.7
  # Face checks on the KYC selfie — presence, eye closure, head pose, occlusion.
  # Free, on-device, offline, no licence key and no per-package binding, which
  # is why this rather than KBY-AI or Onfido: GoOuts has five bundle IDs and
  # every commercial SDK licences per bundle ID.
  # NOT liveness and NOT face recognition — see services/face_check_service.dart.
  google_mlkit_face_detection: ^0.13.2
  image_picker: ^1.1.2
  http: ^1.2.0
  geolocator: ^14.0.3
  permission_handler: ^12.0.3
  google_maps_flutter: ^2.9.0
  firebase_database: ^12.4.4
  crypto: ^3.0.3
  shimmer: ^3.0.0
  shared_preferences: ^2.3.2
  local_auth: ^3.0.1
  url_launcher: ^6.3.0
  mobile_scanner: ^7.2.0
  qr_flutter: ^4.1.0

  # ── Short Stay ──────────────────────────────────────────────────────────
  # path_provider: temp files for evidence photo compression. Compressing to a
  # temp file and uploading FROM the file is what keeps one image in memory at
  # a time. This app has been killed by iOS Jetsam before.
  path_provider: ^2.1.4
  # share_plus: the share button on a listing.
  # ^13 not ^10: share_plus 10 pins win32 ^5.5.3 which collides with
  # geolocator 14 via package_info_plus needing win32 ^6.
  share_plus: ^13.3.0
  # table_calendar: the booking date range picker, screen 11.
  table_calendar: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/special offers/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon_source.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#0392CA"
  adaptive_icon_foreground: "assets/images/icon_source.png"
  min_sdk_android: 21
  web:
    generate: false
