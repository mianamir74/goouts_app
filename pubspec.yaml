name: goouts
description: GoOuts - Discover & Earn

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.2.0
  firebase_storage: ^12.1.0
  smooth_page_indicator: ^1.1.0
  confetti: ^0.7.0
  cached_network_image: ^3.3.1
  camera: ^0.10.6
  image: ^4.1.7
  image_picker: ^1.1.2
  http: ^1.2.0
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  crypto: ^3.0.3
  shimmer: ^3.0.0
  shared_preferences: ^2.3.2
  mobile_scanner: ^5.2.3
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/goouts_logo.png
    - assets/images/special offers/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/goouts_logo.png"
  adaptive_icon_background: "#0392CA"
  adaptive_icon_foreground: "assets/images/goouts_logo.png"
