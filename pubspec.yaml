name: goouts
description: GoOuts - Discover & Earn

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^8.1.0
  firebase_core: ^4.11.0
  firebase_crashlytics: ^5.2.4
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  cloud_functions: ^6.3.3
  firebase_storage: ^13.0.0
  firebase_messaging: ^16.0.0
  smooth_page_indicator: ^2.0.1
  confetti: ^0.8.0
  cached_network_image: ^3.3.1
  camera: ^0.12.0+1
  image: ^4.1.7
  image_picker: ^1.1.2
  http: ^1.2.0
  geolocator: ^14.0.3
  permission_handler: ^12.0.3
  google_maps_flutter: ^2.9.0
  firebase_database: ^12.4.4
  crypto: ^3.0.3
  shimmer: ^3.0.0
  shared_preferences: ^2.3.2
  local_auth: ^3.0.1
  url_launcher: ^6.3.0
  mobile_scanner: ^7.2.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/goouts_logo.png
    - assets/images/special offers/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/virtual_card_ios.png"
  remove_alpha_ios: true
  adaptive_icon_background: "assets/images/virtual_card.png"
  adaptive_icon_foreground: "assets/images/virtual_card.png"
  min_sdk_android: 21
  web:
    generate: false
